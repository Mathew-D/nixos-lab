[colors]
background = "#161616FF"
text_primary = "#E8E8EAFF"
text_muted = "#8A8A92FF"
accent_primary = "#33B1FFFF"
accent_secondary = "#EE5396FF"
warning = "#F5C96BFF"
error = "#EE5396FF"
insert_hint = "#33B1FF80"
backdrop = "#000000FF"
shadow = "#00000088"

[colors.border]
focused = "#33B1FFFF"
unfocused = "#161616FF"
outer = "#000000FF"

[colors.overview]
badge = "#33B1FFFF"

[colors.tab_bar]
active = "#33B1FFFF"
urgent = "#EE5396FF"

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 16
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 20
offset_x = 0
offset_y = 10
